<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - B0b's Keyboard Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop">
        <a class="back-link" href="index.html">&larr; Back to shop</a>
        <header class="shop-header gallery-minimal-header">
            <h1> Gallery</h1>

        </header>

        <div class="minimal-grid">
            <!-- Caeseura -->
            <div class="minimal-card image-slider" id="sl ider-caeseura">
                <div class="slider-container">
                    <img src="photos/gallery-photos/caeseura/IMG_3554-1.jpg" alt="Caeseura view 1" class="slider-img active">
                    <img src="photos/gallery-photos/caeseura/IMG_3553-1.jpg" alt="Caeseura view 2" class="slider-img" style="object-position: 30% 30%;">
                    <img src="photos/gallery-photos/caeseura/IMG_3563-1.jpg" alt="Caeseura view 3" class="slider-img">
                    
                    <button class="slider-btn prev-btn">&#10094;</button>
                    <button class="slider-btn next-btn">&#10095;</button>
                </div>
                <a href="blog/stay-tuned-blog">
                    <div class="minimal-caption">
                        <span class="cap-title">Caeseura</span>
                    </div>
                </a>
            </div>

            <!-- Lemonshark -->
            <div class="minimal-card image-slider" id="slider-lemonshark">
                <div class="slider-container">
                    <img src="photos/gallery-photos/lemonshark/IMG_3827.JPG" alt="Lemonshark view 1" class="slider-img active" style="object-position: 30% 110%;">
                    <img src="photos/gallery-photos/lemonshark/IMG_3839.JPG" alt="Lemonshark view 2" class="slider-img" style="object-position: 50% 65%;">
                    
                    <button class="slider-btn prev-btn">&#10094;</button>
                    <button class="slider-btn next-btn">&#10095;</button>
                </div>
                <a href="blog/stay-tuned-blog">
                    <div class="minimal-caption">
                        <span class="cap-title">Lemonshark</span>
                    </div>
                </a>
            </div>

            <!-- Corne -->
            <div class="minimal-card image-slider" id="slider-lemonshark">
                <div class="slider-container">
                    <img src="photos/gallery-photos/corne/IMG_3570.JPG" alt="Corne view 1" class="slider-img active" style="object-position: 30% 60%;">
                    <img src="photos/gallery-photos/corne/IMG_3574.JPG" alt="Corne view 2" class="slider-img" style="object-position: 70% 65%;">
                    
                    <button class="slider-btn prev-btn">&#10094;</button>
                    <button class="slider-btn next-btn">&#10095;</button>
                </div>
                <a href="blog/stay-tuned-blog">
                    <div class="minimal-caption">
                        <span class="cap-title">Corne (Typeractive kit)</span>
                    </div>
                </a>
            </div>

            <!-- Ximi -->
            <div class="minimal-card image-slider" id="slider-lemonshark">
                <div class="slider-container">
                    <img src="photos/gallery-photos/ximi/IMG_3584.JPG" alt="Ximi view 1" class="slider-img active" style="object-position: 0% 60%;">
                    <img src="photos/gallery-photos/ximi/IMG_3587.JPG" alt="Ximi view 2" class="slider-img" style="object-position: 70% 65%;">
                    
                    <button class="slider-btn prev-btn">&#10094;</button>
                    <button class="slider-btn next-btn">&#10095;</button>
                </div>
                <a href="blog/stay-tuned-blog">
                    <div class="minimal-caption">
                        <span class="cap-title">Ximi v2</span>
                    </div>
                </a>
            </div>


        </div>


        <footer>Want something engineered specifically for you? <a href="custom.html" style="color: var(--jungle-teal); font-weight: 600; text-decoration: underline;">Request a custom build</a></footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
