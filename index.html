<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B0b's Keyboard Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop">
        <h1 class="shop-header">B0b's Keyboard Shop</h1>

        <div class="item-card">
            <img class="item-img" src="https://raw.githubusercontent.com/theb0b12/caeseura/refs/heads/main/photos/IMG_7705(1).jpeg" alt="Caeseura keyboard">
            <div class="item-body">
                <div class="item-top">
                    <p class="item-name">Caeseura</p>
                    <p class="item-price">$35</p>
                </div>
                <div class="tags">
                    <span class="tag">MX + Choc Hotswap</span>
                    <span class="tag">Row Staggered</span>
                    <span class="tag">Arrow Keys + Ctrl & Super Built In*</span>
                    <button class="btn-push"><span>Add to cart</span></button>
                    
                </div>
            </div>
        </div>

        <div class="item-card">
            <img class="item-img item-img--contain" src="https://raw.githubusercontent.com/GEIGEIGEIST/KLOR/e2f9c2cde5200189e57c4f89eeff90686cc359fe/docs/images/klor-layouts.svg" alt="KLOR keyboard layouts">
            <div class="item-body">
                <div class="item-top">
                    <p class="item-name">KLON</p>
                    <p class="item-price">$25</p>
                </div>
                <div class="tags">
                    <span class="tag">36–42 keys</span>
                    <span class="tag">MX + Choc Hotswap</span>
                    <span class="tag">4 Possible Layouts</span>
                    <button class="btn-push"><span>Add to cart</span></button>
                </div>
            </div>
        </div>

        <div class="item-card">
            <img class="item-img" src="https://media.discordapp.net/attachments/1054306687303032872/1489158108231241788/image.png?ex=69e87290&is=69e72110&hm=a2b862a2fe1a04bb4c345a63fca15bbb20247acc2787d7999466bef66180efed&=&format=webp&quality=lossless&width=899&height=477" alt="Good Wings keyboard">
            <div class="item-body">
                <div class="item-top">
                    <p class="item-name">Good Wings</p>
                    <p class="item-price">$45</p>
                </div>
                <div class="tags">
                    <span class="tag">Custom</span>
                    <span class="tag">42 keys</span>
                    <span class="tag">Cirque Trackpad</span>
                    <button class="btn-push"><span>Add to cart</span></button>
                </div>

        </div>
    </div>

    
        


    <footer>* Depending on keymap</footer>

    <script src="app.js"></script>
</body>
</html>
